name: Daily IPTV Auto Renew

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 3:00 فجراً بتوقيت السعودية (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً بضغطة زر للتجربة في أي وقت

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Install Playwright Browsers
        run: |
          npx playwright install chromium --with-deps

      - name: Run IPTV Automation Script
        run: |
          python automator.py
