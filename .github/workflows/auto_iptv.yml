name: Auto Update IPTV Playlist

on:
  schedule:
    # التشغيل التلقائي يومياً الساعة 5:00 صباحاً بتوقيت مكة المكرمة
    - cron: '0 2 * * *'
  workflow_dispatch: # يتيح لك تشغيل البوت يدوياً بضغطة زر للتجربة

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright requests
        playwright install chromium
        playwright install-deps

    - name: Run IPTV Automation Bot
      env:
        MYTV_DEVICE_ID: "d2ae-801d-d2f7-94d5-9398"
      run: |
        python bot.py
